[project]
name = "smart-grid-monitoring"
version = "0.1.0"
description = "Real-time grid monitoring and billing system"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.15.0",
    "fastapi>=0.141.1",
    "pandas>=3.0.5",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src"]
